services:
  postgres:
    image: postgres:16
    platform: linux/amd64
    container_name: private_messenger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger_password
      POSTGRES_DB: private_messenger
    ports:
      - "5432:5432"
    volumes:
      - private_messenger_pgdata:/var/lib/postgresql/data

volumes:
  private_messenger_pgdata: